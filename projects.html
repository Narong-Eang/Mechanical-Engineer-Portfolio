<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Engineering portfolio of Hynarong Eang, Mechanical Engineering student at RMIT University, Melbourne.">
  <title>Hynarong Eang | Engineering Projects</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top" data-page="projects">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="site-header"></div>
  <main id="main-content" class="page-main">
    <header class="page-heading"><h1 id="page-title">Engineering Projects &amp; Experience</h1><p class="page-heading__intro">A record of engineering work. Each project opens into a visual case study.</p></header>

    <section id="timeline" aria-label="Engineering project timeline">
      <ol class="timeline" id="timeline-list"></ol>
    </section>
  </main>
  <div id="site-footer"></div>

  <dialog class="detail-dialog" id="detail-dialog" aria-labelledby="detail-title">
    <div class="detail-shell">
      <div class="detail-top">
        <span class="detail-top__date" id="detail-date"></span>
        <button class="close-button" id="detail-close" type="button" aria-label="Close project details">Close ×</button>
      </div>
      <div class="detail-scroll">
        <div class="detail-grid">
          <section class="gallery" aria-label="Project photo gallery">
            <div class="gallery-stage" id="gallery-stage"></div>
            <p class="gallery-caption" id="gallery-caption" aria-live="polite"></p>
            <div class="thumbnails" id="thumbnails" role="group" aria-label="Project image thumbnails"></div>
          </section>
          <article class="detail-copy">
            <p class="eyebrow" id="detail-category"></p>
            <h2 id="detail-title"></h2>
            <p class="detail-event-badge" id="detail-badge" hidden></p>
            <p class="detail-copy__summary" id="detail-summary"></p>
            <div class="detail-copy__description" id="detail-description"></div>
            <div class="detail-documents" id="detail-documents" hidden></div>
            <ul class="tags" id="detail-tags" aria-label="Tools and project tags"></ul>
          </article>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="lightbox" id="lightbox" aria-label="Expanded project photo">
    <div class="lightbox__frame">
      <button class="close-button" id="lightbox-close" type="button" aria-label="Close expanded photo">Close ×</button>
      <img id="lightbox-image" alt="">
      <p class="lightbox__caption" id="lightbox-caption"></p>
    </div>
  </dialog>

  <script src="site.js"></script>
  <script src="entries.js"></script>
  <script>
    const ENTRIES = window.ENTRIES;

    document.documentElement.classList.add("js");
    const timelineList = document.getElementById("timeline-list");
    const detailDialog = document.getElementById("detail-dialog");
    const lightbox = document.getElementById("lightbox");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let activeEntry = null;
    let activeImage = 0;

    const escapeHTML = (value) => String(value).replace(/[&<>"']/g, (character) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
    })[character]);

    const categoryNames = { design: "Design", analysis: "Analysis", team: "Team project" };

    function placeholderMarkup(title, compact = false) {
      const label = compact ? "Add project photos to the images array" : "Project photo to add";
      return `<div class="photo-placeholder${compact ? " photo-placeholder--compact" : ""}" role="img" aria-label="Photo placeholder for ${escapeHTML(title)}">
        <div class="photo-placeholder__text"><span class="photo-placeholder__symbol" aria-hidden="true">＋</span><span class="photo-placeholder__label">${label}</span><span class="photo-placeholder__project">${escapeHTML(title)}</span></div>
      </div>`;
    }

    function documentCoverMarkup(title) {
      return `<div class="photo-placeholder" role="img" aria-label="PDF report for ${escapeHTML(title)}"><div class="document-cover"><span class="document-cover__icon" aria-hidden="true">▤</span><span>PDF report</span></div></div>`;
    }

    function imageMarkup(image, entry, index, className = "") {
      return `<img class="${className}" src="${escapeHTML(image.src)}" alt="${escapeHTML(image.alt)}" loading="lazy" decoding="async" width="1400" height="900" data-image-index="${index}" data-project-id="${escapeHTML(entry.id)}">`;
    }

    document.addEventListener("error", (event) => {
      const image = event.target;
      if (!(image instanceof HTMLImageElement)) return;
      if (image.id === "lightbox-image") {
        image.hidden = true;
        const frame = image.closest(".lightbox__frame");
        if (frame && !frame.querySelector(".photo-placeholder")) frame.insertAdjacentHTML("afterbegin", placeholderMarkup(activeEntry?.title || "Project photo"));
        return;
      }
      if (!image.dataset.projectId) return;
      const entry = ENTRIES.find((item) => item.id === image.dataset.projectId);
      if (!entry) return;
      const thumbnail = image.closest(".thumbnail");
      if (thumbnail) {
        thumbnail.innerHTML = `<span class="thumbnail-placeholder">Photo unavailable</span>`;
        return;
      }
      const cover = image.closest(".cover");
      const stage = image.closest(".gallery-stage");
      if (cover) cover.innerHTML = placeholderMarkup(entry.title);
      else if (stage) stage.innerHTML = placeholderMarkup(entry.title);
    }, true);

    function renderEntries() {
      timelineList.innerHTML = ENTRIES.map((entry, index) => {
        const categories = entry.categories.map((category) => categoryNames[category] || category).join(" · ");
        const tags = entry.tags.map((tag) => `<li class="tag">${escapeHTML(tag)}</li>`).join("");
        const directDocument = entry.openDocumentDirectly && entry.documents?.length === 1 ? entry.documents[0] : null;
        const cover = entry.images.length ? imageMarkup(entry.images[0], entry, 0) : entry.documents?.length ? documentCoverMarkup(entry.title) : placeholderMarkup(entry.title);
        const cardTarget = directDocument
          ? `href="${escapeHTML(directDocument.href)}" target="_blank" rel="noopener noreferrer"`
          : `href="#detail-dialog" data-open-entry="${index}"`;
        return `<li class="timeline-item reveal">
          <span class="timeline-node" aria-hidden="true"><span class="timeline-node__dot"></span><span class="timeline-node__index">${String(index + 1).padStart(2, "0")}</span></span>
          <article class="entry-card" id="${escapeHTML(entry.id)}">
            <a class="entry-link" ${cardTarget} aria-label="${directDocument ? "Open PDF report for " : "Open "}${escapeHTML(entry.title)}${directDocument ? " in a new tab" : " details"}">
              <div class="cover">${cover}</div>
              <div class="entry-copy">
                <div class="entry-copy__meta"><time class="timeline-date">${escapeHTML(entry.date)}</time><span class="category-label">${escapeHTML(categories)}</span></div>
                <h2>${escapeHTML(entry.title)}</h2>
                ${entry.badge ? `<p class="entry-badge">${escapeHTML(entry.badge)}</p>` : ""}
                <p class="entry-copy__summary">${escapeHTML(entry.summary)}</p>
                <p class="entry-copy__description">${escapeHTML(entry.description)}</p>
                <ul class="tags" aria-label="Project tools">${tags}</ul>
                <span class="card-cta">${directDocument ? "Open PDF" : "Open Case Study"}</span>
              </div>
            </a>
          </article>
        </li>`;
      }).join("");
      observeReveals();
    }

    const revealObserver = "IntersectionObserver" in window ? new IntersectionObserver((items, observer) => {
      items.forEach((item) => {
        if (item.isIntersecting) {
          item.target.classList.add("is-visible");
          observer.unobserve(item.target);
        }
      });
    }, { rootMargin: "0px 0px -7% 0px", threshold: 0.05 }) : null;

    function observeReveals() {
      document.querySelectorAll(".reveal:not(.is-visible)").forEach((item) => {
        if (reducedMotion.matches || !revealObserver) item.classList.add("is-visible");
        else revealObserver.observe(item);
      });
    }

    function renderThumbnails() {
      const target = document.getElementById("thumbnails");
      if (!activeEntry.images.length) {
        target.innerHTML = `<div class="thumbnail thumbnail-placeholder" aria-hidden="true">${activeEntry.documents?.length ? "PDF report" : "Photos to add"}</div>`;
        return;
      }
      target.innerHTML = activeEntry.images.map((image, index) => `<button class="thumbnail" type="button" data-thumbnail="${index}" aria-label="Show photo ${index + 1}: ${escapeHTML(image.alt)}" aria-current="${index === activeImage}">${imageMarkup(image, activeEntry, index)}</button>`).join("");
    }

    function showImage(index) {
      if (!activeEntry?.images.length) return;
      activeImage = (index + activeEntry.images.length) % activeEntry.images.length;
      const image = activeEntry.images[activeImage];
      const stage = document.getElementById("gallery-stage");
      stage.innerHTML = `<button class="gallery-main" id="zoom-image" type="button" aria-label="Zoom photo: ${escapeHTML(image.alt)}">${imageMarkup(image, activeEntry, activeImage)}</button>
        ${activeEntry.images.length > 1 ? `<button class="gallery-arrow gallery-arrow--prev" type="button" data-step="-1" aria-label="Previous photo">←</button><button class="gallery-arrow gallery-arrow--next" type="button" data-step="1" aria-label="Next photo">→</button>` : ""}
        <span class="gallery-count" aria-live="polite">${String(activeImage + 1).padStart(2, "0")} / ${String(activeEntry.images.length).padStart(2, "0")}</span>`;
      document.getElementById("gallery-caption").textContent = image.caption || image.alt;
      document.querySelectorAll(".thumbnail").forEach((button, buttonIndex) => button.setAttribute("aria-current", String(buttonIndex === activeImage)));
      if (lightbox.open) {
        const largeImage = document.getElementById("lightbox-image");
        largeImage.hidden = false;
        lightbox.querySelector(".photo-placeholder")?.remove();
        largeImage.src = image.src;
        largeImage.alt = image.alt;
        document.getElementById("lightbox-caption").textContent = image.caption || image.alt;
      }
    }

    function openEntry(index) {
      activeEntry = ENTRIES[index];
      if (!activeEntry) return;
      activeImage = 0;
      document.getElementById("detail-date").textContent = activeEntry.date;
      document.getElementById("detail-category").textContent = activeEntry.categories.map((category) => categoryNames[category] || category).join(" / ");
      document.getElementById("detail-title").textContent = activeEntry.title;
      const detailBadge = document.getElementById("detail-badge");
      detailBadge.textContent = activeEntry.badge || "";
      detailBadge.hidden = !activeEntry.badge;
      document.getElementById("detail-summary").textContent = activeEntry.summary;
      document.getElementById("detail-description").textContent = activeEntry.description;
      const documents = activeEntry.documents || [];
      const documentLinks = document.getElementById("detail-documents");
      documentLinks.hidden = documents.length === 0;
      documentLinks.innerHTML = documents.map((document) => `<a class="document-link" href="${escapeHTML(document.href)}" target="_blank" rel="noopener noreferrer">${escapeHTML(document.label)}</a>`).join("");
      document.getElementById("detail-tags").innerHTML = activeEntry.tags.map((tag) => `<li class="tag">${escapeHTML(tag)}</li>`).join("");
      if (activeEntry.images.length) {
        renderThumbnails();
        showImage(0);
      } else {
        document.getElementById("gallery-stage").innerHTML = documents.length ? documentCoverMarkup(activeEntry.title) : placeholderMarkup(activeEntry.title);
        document.getElementById("gallery-caption").textContent = documents.length ? "PDF report" : "Add images to this entry's images array to enable the photo carousel.";
        renderThumbnails();
      }
      detailDialog.showModal();
      document.getElementById("detail-close").focus();
    }

    document.addEventListener("click", (event) => {
      const entryLink = event.target.closest("[data-open-entry]");
      if (entryLink) {
        event.preventDefault();
        openEntry(Number(entryLink.dataset.openEntry));
        return;
      }
      const thumbnail = event.target.closest("[data-thumbnail]");
      if (thumbnail) showImage(Number(thumbnail.dataset.thumbnail));
      const step = event.target.closest("[data-step]");
      if (step) showImage(activeImage + Number(step.dataset.step));
      if (event.target.closest("#zoom-image")) {
        const image = activeEntry.images[activeImage];
        const lightboxImage = document.getElementById("lightbox-image");
        lightboxImage.hidden = false;
        lightbox.querySelector(".photo-placeholder")?.remove();
        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt;
        document.getElementById("lightbox-caption").textContent = image.caption || image.alt;
        lightbox.showModal();
        document.getElementById("lightbox-close").focus();
      }
    });

    document.getElementById("detail-close").addEventListener("click", () => detailDialog.close());
    document.getElementById("lightbox-close").addEventListener("click", () => lightbox.close());
    [detailDialog, lightbox].forEach((dialog) => dialog.addEventListener("click", (event) => { if (event.target === dialog) dialog.close(); }));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (lightbox.open) { event.preventDefault(); lightbox.close(); return; }
        if (detailDialog.open) { event.preventDefault(); detailDialog.close(); return; }
      }
      if (!activeEntry?.images.length) return;
      const step = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
      if (!step) return;
      event.preventDefault();
      const focusedArrow = event.target.closest?.("[data-step]");
      showImage(activeImage + step);
      if (focusedArrow && !lightbox.open) document.querySelector(`.gallery-arrow[data-step="${focusedArrow.dataset.step}"]`)?.focus();
    });

    let highlightTimeout;
    let highlightedCard = null;
    function scrollToProjectFromHash() {
      if (!window.location.hash) return;
      let requestedProject;
      try { requestedProject = decodeURIComponent(window.location.hash.slice(1)); }
      catch { return; }
      const card = document.getElementById(requestedProject);
      if (!card?.classList.contains("entry-card")) return;

      const timelineItem = card.closest(".timeline-item");
      timelineItem?.classList.add("is-visible");
      if (timelineItem) revealObserver?.unobserve(timelineItem);

      requestAnimationFrame(() => requestAnimationFrame(() => {
        card.scrollIntoView({ block: "start", behavior: reducedMotion.matches ? "auto" : "smooth" });
        if (highlightedCard && highlightedCard !== card) highlightedCard.classList.remove("is-highlighted");
        card.classList.remove("is-highlighted");
        void card.offsetWidth;
        card.classList.add("is-highlighted");
        highlightedCard = card;
        window.clearTimeout(highlightTimeout);
        highlightTimeout = window.setTimeout(() => {
          card.classList.remove("is-highlighted");
          if (highlightedCard === card) highlightedCard = null;
        }, 2050);
      }));
    }

    renderEntries();
    scrollToProjectFromHash();
    window.addEventListener("hashchange", scrollToProjectFromHash);
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) scrollToProjectFromHash();
    });
  </script>
</body>
</html>
